[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecheck-trufflehog"
version = "1.0.0"
description = "Run TruffleHog against a local project and produce a redacted JSON/Markdown secrets report."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VibeCheck" }]
keywords = ["security", "secrets", "trufflehog", "scanner", "vibecheck"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vibecheck-trufflehog = "vibecheck_trufflehog.trufflehog_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibecheck_trufflehog = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs the real TruffleHog binary (skipped if not installed)"]
